{% extends "layout.html" %}
{% block title %}Create account{% endblock %}
{% block main %}
<div class="auth-shell"><section class="auth-card"><div class="brand-mark auth-logo">F</div><span class="eyebrow">Get started</span><h1>Create your account</h1><p class="page-subtitle">Start with a simulated portfolio and practice trading.</p><form action="/register" method="post" class="stack-form"><div><label class="form-label" for="username">Username</label><input autocomplete="username" autofocus class="form-control app-input" id="username" name="username" placeholder="At least 3 characters" type="text" minlength="3" required></div><div><label class="form-label" for="password">Password</label><input autocomplete="new-password" class="form-control app-input" id="password" name="password" placeholder="At least 6 characters" type="password" minlength="6" required></div><div><label class="form-label" for="confirmation">Confirm password</label><input autocomplete="new-password" class="form-control app-input" id="confirmation" name="confirmation" placeholder="Repeat your password" type="password" minlength="6" required></div><button class="btn btn-primary btn-lg w-100" type="submit">Create account</button></form><p class="auth-switch">Already have an account? <a href="/login">Log in</a></p></section></div>
{% endblock %}
