{% extends "layout.html" %}
{% block title %}Log in{% endblock %}
{% block main %}
<div class="auth-shell"><section class="auth-card"><div class="brand-mark auth-logo">F</div><span class="eyebrow">Welcome back</span><h1>Log in to Finora</h1><p class="page-subtitle">Access your portfolio and continue trading.</p><form action="/login" method="post" class="stack-form"><div><label class="form-label" for="username">Username</label><input autocomplete="username" autofocus class="form-control app-input" id="username" name="username" placeholder="Your username" type="text" required></div><div><label class="form-label" for="password">Password</label><input autocomplete="current-password" class="form-control app-input" id="password" name="password" placeholder="Your password" type="password" required></div><button class="btn btn-primary btn-lg w-100" type="submit">Log in</button></form><p class="auth-switch">New here? <a href="/register">Create an account</a></p></section></div>
{% endblock %}
